
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Produk UMKM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Katalog Produk UMKM</h1>

    <div class="container">

        <!-- Produk dengan stok tersedia -->
        <div class="card">
            <div class="gambar">Gambar Produk 1</div>
            <h2>Keripik Singkong</h2>
            <p>Keripik singkong renyah dan gurih.</p>
            <p class="harga">Rp15.000</p>
            <p class="stok">Stok Tersedia</p>
            <button class="btn">Tambah ke Keranjang</button>
        </div>

        <!-- Produk dengan stok habis -->
        <div class="card">
            <div class="gambar">Gambar Produk 2</div>
            <h2>Teh Botol</h2>
            <p>Minuman teh siap diminum.</p>
            <p class="harga">Rp5.000</p>
            <p class="habis">Stok Habis</p>
            <button class="btn" disabled>Stok Habis</button>
        </div>

    </div>

</body>
</html>
